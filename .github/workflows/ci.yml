name: ci
on:
  pull_request:
    branches: [main, 'plan-*']
  # main commits need their own `check` so plan-N branches can be cut from them under the ruleset
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: 'true'

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.d.outputs.docs_only }}
      has_ui: ${{ steps.d.outputs.has_ui }}
      has_swift: ${{ steps.d.outputs.has_swift }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: d
        run: |
          base=${{ github.event.pull_request.base.sha || github.event.before }}
          # hashFiles is not allowed in job-level if, so detect the packages here
          {
            echo "docs_only=$(git diff --name-only --no-renames "$base"...HEAD | scripts/docs-only.sh)"
            echo "has_ui=$([ -f ui/package.json ] && echo true || echo false)"
            echo "has_swift=$([ -f helpers/reminders-helper/Package.swift ] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"

  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: |
          for c in $(git rev-list --no-merges "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"); do
            git log -1 --format=%B "$c" > "$RUNNER_TEMP/msg"
            scripts/check-commit-msg.sh "$RUNNER_TEMP/msg"
          done

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck scripts/*.sh scripts/hooks/* scripts/test/*.sh
      - run: scripts/test/test-checks.sh

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: 'clippy, rustfmt' }
      - uses: Swatinem/rust-cache@v2
      # the Tauri app crate links GTK/WebKit on Linux
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libdbus-1-dev pkg-config
      - run: scripts/check-layout.sh
      - run: scripts/check-boundaries.sh
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - uses: taiki-e/install-action@v2
        with: { tool: cargo-machete }
      - run: cargo machete
      - run: cargo build --workspace

  # Sharding rule: a job that passes 3 minutes is split, balanced by measured time. The slowest
  # package gets its own job. Today: core alone, everything else together.
  test-core:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p taskapp-core

  test-rest:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # the Tauri app crate links GTK/WebKit on Linux
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libdbus-1-dev pkg-config
      - run: cargo test --workspace --exclude taskapp-core

  test-ui:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.has_ui == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: ui/pnpm-lock.yaml }
      - run: pnpm -C ui install --frozen-lockfile
      - run: pnpm -C ui build
      - run: pnpm -C ui test

  test-swift:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.has_swift == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path helpers/reminders-helper

  size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/size-report.sh
      - name: duplicate-code groups (report only)
        run: npx -y jscpd@4 --min-lines 10 --reporters console crates app ui/src || true

  # The one required status. Skipped jobs count as passing; it reports on every PR.
  check:
    if: always()
    needs: [changes, commits, scripts, lint, test-core, test-rest, test-ui, test-swift, size]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo '${{ toJSON(needs) }}'
          if echo '${{ toJSON(needs) }}' | grep -qE '"result": "(failure|cancelled)"'; then exit 1; fi
